blueprint:
  name: "IntellegyHub — L-4 — Світлова сцена з кнопки"
  description: >
    Натискання фізичної кнопки застосовує збережену сцену освітлення.
    Повторне натискання знову застосовує ту саму сцену.
  domain: automation

  input:
    button:
      name: "Кнопка"
      description: "Оберіть дискретний вхід, до якого підключена кнопка."
      selector:
        entity:
          filter:
            - domain: binary_sensor

    pressed_state:
      name: "Стан натискання"
      description: "Стан входу під час натискання кнопки."
      default: "on"
      selector:
        select:
          options:
            - label: "Увімкнено (on)"
              value: "on"
            - label: "Вимкнено (off)"
              value: "off"

    light_scene:
      name: "Світлова сцена"
      description: "Оберіть готову сцену з потрібними станами та яскравістю."
      selector:
        entity:
          filter:
            - domain: scene

triggers:
  - trigger: state
    entity_id: !input button
    to: !input pressed_state
    not_from:
      - "unknown"
      - "unavailable"

actions:
  - action: scene.turn_on
    target:
      entity_id: !input light_scene

mode: queued
