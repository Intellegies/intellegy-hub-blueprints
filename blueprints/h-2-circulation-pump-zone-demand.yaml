blueprint:
  name: "IntellegyHub — H-2 — Циркуляційний насос за запитом зон"
  description: >
    Вмикає насос, якщо хоча б одна зона запитує тепло. Вимикає його,
    коли всі зони підтвердили завершення запиту. Система опалення має
    забезпечувати циркуляцію до моменту пуску насоса.
  domain: automation

  input:
    zone_demands:
      name: "Запити зон"
      description: "Оберіть сутності, стан on яких означає фактичний запит на тепло."
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
            - domain: switch

    pump:
      name: "Насос"
      description: "Оберіть керований вихід циркуляційного насоса."
      selector:
        entity:
          filter:
            - domain: switch

variables:
  zone_demands: !input zone_demands
  pump: !input pump

triggers:
  - trigger: state
    entity_id: !input zone_demands
    to: null

  - trigger: homeassistant
    event: start

actions:
  - variables:
      demand_states: >
        {{ zone_demands | map('states') | list }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ 'on' in demand_states and not is_state(pump, 'on') }}"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input pump

      - conditions:
          - condition: template
            value_template: >
              {{ demand_states | length > 0
                 and demand_states | reject('eq', 'off') | list | length == 0
                 and not is_state(pump, 'off') }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input pump

mode: queued
