blueprint:
  name: "IntellegyHub — Кнопка → освітлення"
  description: >
    Керування освітленням за допомогою фізичної кнопки.
    Кожне натискання перемикає поточний стан освітлення.

    Підтримуються кнопки на входах xDI-16 та X-PORT DI,
    а також освітлення через реле, димери та Zigbee-лампи.

  domain: automation

  input:
    button:
      name: "Кнопка"
      description: "Оберіть вхід, до якого підключена кнопка."
      selector:
        entity:
          filter:
            - domain: binary_sensor

    pressed_state:
      name: "Стан натискання"
      description: "Стан входу під час натискання кнопки."
      default: "on"
      selector:
        select:
          options:
            - label: "Увімкнено (on)"
              value: "on"
            - label: "Вимкнено (off)"
              value: "off"

    target_light:
      name: "Освітлення"
      description: "Оберіть лампу, димер або релейний вихід."
      selector:
        entity:
          filter:
            - domain: light
            - domain: switch

    debounce_ms:
      name: "Захист від повторного спрацювання"
      description: "Мінімальний інтервал між перемиканнями."
      default: 200
      selector:
        number:
          min: 0
          max: 2000
          step: 50
          unit_of_measurement: "мс"
          mode: slider

variables:
  pressed_state: !input pressed_state
  target_light: !input target_light

triggers:
  - trigger: state
    entity_id: !input button
    from: "off"
    to: "on"
    id: pressed_on

  - trigger: state
    entity_id: !input button
    from: "on"
    to: "off"
    id: pressed_off

conditions:
  - condition: template
    value_template: >
      {{
        (trigger.id == 'pressed_on' and pressed_state == 'on')
        or
        (trigger.id == 'pressed_off' and pressed_state == 'off')
      }}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ target_light.startswith('light.') }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: !input target_light

      - conditions:
          - condition: template
            value_template: "{{ target_light.startswith('switch.') }}"
        sequence:
          - action: switch.toggle
            target:
              entity_id: !input target_light

  - delay:
      milliseconds: !input debounce_ms

mode: single
max_exceeded: silent